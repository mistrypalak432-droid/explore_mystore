<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce Fullscreen Animation</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    /* Images container takes full screen */
    .photos {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .photo {
      flex: 1; /* each image takes equal space */
      object-fit: cover;
      opacity: 0;
    }

    .photo1 { animation: slideInLeft 1.5s ease forwards;
    flex: 1;                 /* keep equal space */
  object-fit: cover;       /* crop properly */
  object-position: 80% center; 
}

.photo2 {
  flex: 1;                /* Other images take normal space */
  object-fit: cover;


    
 }
    .photo2 { animation: slideInBottom 1.5s ease forwards 0.5s;
    flex: 1;                /* Other images take normal space */
  object-fit: cover;
 }
    .photo3 { animation: slideInRight 1.5s ease forwards 1s;
    flex: 1;                /* Other images take normal space */
  object-fit: cover;
 }

    /* Overlay for text */
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4); /* dark overlay for readability */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    .overlay h1 {
      font-size: 3.5rem;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeDown 1.3s ease forwards 2s;
    }

    /* Explore Button */
    .btn {
      padding: 14px 35px;
      font-size: 1.3rem;
      border: none;
      border-radius: 30px;
      background: #ff6f61;
      color: white;
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s ease forwards 3s;
      transition: transform 0.3s, background 0.3s;
    }

    .btn:hover {
      background: #e55b4c;
      transform: scale(1.1);
    }

    /* Animations */
    @keyframes slideInLeft {
      from { transform: translateX(-100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideInBottom {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <section class="hero">
    
    <div class="photos">
      <img src="https://i.pinimg.com/1200x/12/52/84/125284f3479b64e5e8ea54164031f82f.jpg" class="photo photo1" alt="Product 1">
      <img src="https://i.pinimg.com/736x/e3/5f/2d/e35f2d8255c2733a2d4bc4ca26f03e68.jpg" class="photo photo2" alt="Product 2">
      <img src="https://i.pinimg.com/1200x/89/5d/bd/895dbd2c51c82dc46d4521feb60be002.jpg" class="photo photo3" alt="Product 3">
    </div>

    <!-- Text & Button Overlay -->
    <div class="overlay">
      <h1>Welcome to My Store</h1>
      <a href="f1.html"><button class="btn">Explore My Store</button></a>
    </div>
  </section>

</body>
</html>
